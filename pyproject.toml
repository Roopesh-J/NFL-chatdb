[project]
name = "nfl-chatdb"
version = "0.1.0"
description = "Two-stage natural-language-to-SQL pipeline over NFL statistics"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "anthropic>=1.0",
    "nfl-data-py>=0.3.2",
    "pydantic>=2.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
nfl-chatdb = "nfl_chatdb.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nfl_chatdb"]

[tool.pytest.ini_options]
addopts = "-m 'not live'"
markers = [
    "live: test makes real network/API calls (deselected by default; run with -m live)",
]
testpaths = ["tests"]
