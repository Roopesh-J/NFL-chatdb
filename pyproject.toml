[project]
name = "nfl-chatdb"
version = "0.1.0"
description = "Two-stage natural-language-to-SQL pipeline over NFL statistics"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "anthropic>=1.0",
    "nfl-data-py>=0.3.2",
    "pydantic>=2.0",
    "python-dotenv>=1.2.3",
    "pywebview>=5.0",
]

[project.scripts]
nfl-chatdb = "nfl_chatdb.cli:main"
nfl-chatdb-app = "nfl_chatdb.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nfl_chatdb"]

[tool.pytest.ini_options]
addopts = "-m 'not live'"
markers = [
    "live: test makes real network/API calls (deselected by default; run with -m live)",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
# Plan/spec docs carry frozen code snippets — don't reformat their fences.
extend-exclude = ["docs"]

[tool.ruff.lint]
# E501 (line length) is left to review, not the linter.
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

# pyright config lives in pyrightconfig.json — its TOML parser trips on
# this file's [dependency-groups] table.
